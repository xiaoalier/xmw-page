<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>初识循环1 · 课堂练习互动</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#eaf1ff,#e9edf6 45%,#f5f1fb);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#17233b;padding:22px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:24px;text-align:center;margin:0 0 4px}
.sub{text-align:center;color:#64748b;font-size:13.5px;margin:0 0 16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.tab{cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 14px;font-size:13.5px;transition:.15s}
.tab:hover{border-color:#818cf8}
.tab.on{background:linear-gradient(135deg,#3b6fd4,#7c3aed);color:#fff;border-color:transparent}
.card{background:#fff;border:1px solid #e2e8f3;border-radius:16px;padding:18px 20px;box-shadow:0 10px 30px rgba(30,52,96,.09)}
.stem{background:#f8fafc;border-left:4px solid #60a5fa;border-radius:8px;padding:10px 14px;font-size:15px;line-height:1.7}
.stem .t{color:#94a3b8;font-size:12px;display:block;margin-bottom:2px}
.params{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0 6px;min-height:8px}
.pv{display:flex;align-items:center;gap:8px;font-size:14px}
.pv input[type=range]{width:170px}
.pv b{color:#4f46e5;min-width:30px;display:inline-block;text-align:center}
.code{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px 16px;font-family:Consolas,monospace;font-size:13.5px;line-height:1.75;overflow:auto;white-space:pre}
.code .kw{color:#c084fc}.code .fn{color:#7dd3fc}.code .s{color:#fca5a5}.code .init{color:#fda4af;font-weight:700}.code .cond{color:#fcd34d;font-weight:700}.code .upd{color:#86efac;font-weight:700}
.run{margin:12px 0;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.badge{background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:10px 16px;font-size:15px;white-space:nowrap}
.badge b{font-size:22px;color:#4338ca;display:inline-block;min-width:34px;text-align:center}
.badge .sum{color:#047857;font-weight:700;margin-top:6px;font-size:14px}
.out{flex:1;min-width:260px;min-height:64px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.tok{background:#fff;border:1px solid #dbeafe;border-radius:8px;padding:2px 9px;font-family:Consolas,monospace;font-size:14px;animation:pop .22s}
.tok.hot{background:#fef3c7;border-color:#f59e0b}
.tok.line{background:#eef2ff;border-color:#c7d2fe;font-family:inherit}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{cursor:pointer;border:none;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3b6fd4,#7c3aed);transition:transform .1s}
button:hover{transform:translateY(-1px)}
button.ghost{background:#eef2ff;color:#3730a3}
button:disabled{opacity:.45;cursor:default;transform:none}
.speed{font-size:13.5px;color:#475569}
.speed input{vertical-align:middle}
.hint{margin-top:14px;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>初识循环1 · 课堂练习互动</h1>
  <p class="sub">调参数 → 单步 / 播放，看 for 循环怎么一步步跑出结果</p>
  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="stem" id="stem"></div>
    <div class="params" id="params"></div>
    <div class="code" id="code"></div>
    <div class="run">
      <div class="badge">当前 i = <b id="ival">–</b><div class="sum" id="sum"></div></div>
      <div class="out" id="out"></div>
    </div>
    <div class="ctrl">
      <button id="step">单步 ▷</button>
      <button id="play">▶ 播放</button>
      <button id="jump" class="ghost">⏭ 直接出结果</button>
      <button id="reset" class="ghost">↻ 重播</button>
      <label class="speed">速度 <input type="range" id="speed" min="1" max="10" value="6"></label>
      <span id="status" style="color:#64748b;font-size:13px"></span>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var PROBS = [
  { title:"我爱学习", stem:"请输出 5 行「我爱学习」。", inputs:[], unit:"line",
    s:function(){return 1;}, e:function(){return 5;}, st:function(){return 1;},
    head:"for (int i = 1; i <= 5; i++)", body:'    cout << "我爱学习" << endl;',
    hint:"循环一共跑 5 次，每跑一次就输出一行「我爱学习」。" },

  { title:"一百五", stem:"请输出 1~150 的所有数字，每个数字之间用空格隔开。", inputs:[],
    s:function(){return 1;}, e:function(){return 150;}, st:function(){return 1;},
    head:"for (int i = 1; i <= 150; i++)", body:'    cout << i << " ";',
    hint:"起点 1、终点 150、每次 +1 —— 正着从小到大输出。" },

  { title:"再来一百五", stem:"请输出 150~300 的所有数字，每个数字之间用空格隔开。", inputs:[],
    s:function(){return 150;}, e:function(){return 300;}, st:function(){return 1;},
    head:"for (int i = 150; i <= 300; i++)", body:'    cout << i << " ";',
    hint:"只是把起点换成 150、终点换成 300，其余不变。" },

  { title:"百五一", stem:"请输出从 150 倒数到 1 的所有数字，每个数字之间用空格隔开。", inputs:[],
    s:function(){return 150;}, e:function(){return 1;}, st:function(){return -1;},
    head:"for (int i = 150; i >= 1; i--)", body:'    cout << i << " ";',
    hint:"想倒着数：起点大、终点小，条件用 >=、变化用 i-- 。" },

  { title:"n个数", stem:"输入一个正整数 n，请输出 1~n 的所有数字，每个数字之间用空格隔开。", inputs:[{k:"n",def:10,min:1,max:60}],
    s:function(v){return 1;}, e:function(v){return v.n;}, st:function(){return 1;},
    head:"for (int i = 1; i <= n; i++)", body:'    cout << i << " ";',
    hint:"把终点从固定的 150 换成输入进来的 n，就通用了——拖滑块改 n 试试。" },

  { title:"再来n个数", stem:"输入一个正整数 n，请输出从数字 n 倒数到 1 的所有数字，每个数字之间用空格隔开。", inputs:[{k:"n",def:10,min:1,max:60}],
    s:function(v){return v.n;}, e:function(){return 1;}, st:function(){return -1;},
    head:"for (int i = n; i >= 1; i--)", body:'    cout << i << " ";',
    hint:"起点是 n、终点是 1、每次 -1 —— 输入多少就从多少倒数到 1。" },

  { title:"五十", stem:"输入一个正整数 n，请输出 n~50 的所有数字，每个数字之间用空格隔开。", inputs:[{k:"n",def:10,min:1,max:50}],
    s:function(v){return v.n;}, e:function(){return 50;}, st:function(){return 1;},
    head:"for (int i = n; i <= 50; i++)", body:'    cout << i << " ";',
    hint:"起点是 n、终点固定 50。如果把 n 拖到 50 以上，循环就一次都不跑（想一想为什么？）。" },

  { title:"累加", stem:"输入两个正整数 x, y，请输出 x~y 之间所有奇数的总和。", inputs:[{k:"x",def:1,min:1,max:40},{k:"y",def:10,min:1,max:40}], mode:"sumOdd",
    s:function(v){return v.x;}, e:function(v){return v.y;}, st:function(){return 1;},
    code:"int sum = 0;\nfor (int i = x; i <= y; i++) {\n    if (i % 2 != 0) sum += i;   // 奇数才加进去\n}\ncout << sum;",
    hint:"遍历 x~y，遇到奇数就加进 sum，最后输出 sum。拖 x/y 看结果怎么变。" }
];

var tabs=document.getElementById("tabs"), stemEl=document.getElementById("stem"), paramsEl=document.getElementById("params"),
    codeEl=document.getElementById("code"), outEl=document.getElementById("out"), ivalEl=document.getElementById("ival"),
    sumEl=document.getElementById("sum"), hintEl=document.getElementById("hint"), statusEl=document.getElementById("status"),
    btnStep=document.getElementById("step"), btnPlay=document.getElementById("play"), btnJump=document.getElementById("jump"),
    btnReset=document.getElementById("reset"), speed=document.getElementById("speed");

var cur=0, timer=null, running=false;
var st={ i:0, started:false, done:false, sum:0 };

function vals(){
  var v={}, p=PROBS[cur];
  (p.inputs||[]).forEach(function(inp){ v[inp.k]=inp.cur!==undefined?inp.cur:inp.def; });
  return v;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function colorHead(head){
  // 给 初始化/条件/更新 三个分号段上色
  var m=head.match(/^(for\s*\(\s*)(int\s+i\s*=\s*[^;]+)(;)([^;]+)(;)([^)]+)(\).*)$/);
  if(!m) return esc(head);
  return esc(m[1])+'<span class="init">'+esc(m[2])+'</span>'+esc(m[3])+'<span class="cond">'+esc(m[4])+'</span>'+esc(m[5])+'<span class="upd">'+esc(m[6])+'</span>'+esc(m[7]);
}

function stop(){ if(timer){clearInterval(timer);timer=null;} running=false; btnPlay.textContent="▶ 播放"; }
function renderTabs(){
  tabs.innerHTML="";
  PROBS.forEach(function(p,i){
    var b=document.createElement("button"); b.className="tab"+(i===cur?" on":""); b.textContent=p.title;
    b.onclick=function(){ cur=i; setup(); }; tabs.appendChild(b);
  });
}
function renderParams(){
  var p=PROBS[cur]; paramsEl.innerHTML="";
  if(!p.inputs||!p.inputs.length){ paramsEl.innerHTML='<span style="color:#94a3b8;font-size:13px">（本题无需输入参数）</span>'; return; }
  p.inputs.forEach(function(inp){
    if(inp.cur===undefined) inp.cur=inp.def;
    var wrap=document.createElement("label"); wrap.className="pv";
    wrap.innerHTML=inp.k+" = <b>"+inp.cur+"</b>";
    var r=document.createElement("input"); r.type="range"; r.min=inp.min; r.max=inp.max; r.value=inp.cur;
    r.oninput=function(){ inp.cur=parseInt(r.value,10); wrap.querySelector("b").textContent=inp.cur; reset(); };
    wrap.appendChild(r); paramsEl.appendChild(wrap);
  });
}
function renderCode(){
  var p=PROBS[cur];
  if(p.code){ codeEl.innerHTML=esc(p.code); return; }
  codeEl.innerHTML=colorHead(p.head)+" {\n"+esc(p.body)+"\n}";
}
function setup(){
  renderTabs(); renderParams(); renderCode();
  stemEl.innerHTML='<span class="t">题目</span>'+esc(PROBS[cur].stem);
  hintEl.innerHTML="💡 "+esc(PROBS[cur].hint);
  reset();
}
function reset(){
  stop(); var v=vals(), p=PROBS[cur];
  st={ i:p.s(v), started:false, done:false, sum:0, s:p.s(v), e:p.e(v), step:p.st(v), mode:p.mode||"print" };
  ivalEl.textContent="–"; sumEl.textContent=""; outEl.innerHTML=""; statusEl.textContent="点「单步」或「播放」开始";
  btnStep.disabled=false; btnJump.disabled=false; btnReset.disabled=true;
}
function condTrue(){ var stt=st; return stt.step>0 ? stt.i<=stt.e : stt.i>=stt.e; }
function doStep(){
  var p=PROBS[cur];
  if(!st.started){ st.started=true; btnReset.disabled=false; }
  if(!condTrue()){ finish(); return; }
  var i=st.i;
  ivalEl.textContent=i;
  if(st.mode==="sumOdd"){
    if(i%2!==0){ st.sum+=i; addTok(i,true); sumEl.textContent="sum = "+st.sum; }
    else { addTok(i,false); statusEl.textContent="i="+i+" 是偶数 → 跳过（sum 不变）"; }
  } else {
    var txt = (p.unit==="line") ? "我爱学习" : i;
    addTok(txt, true);
  }
  st.i += st.step;
  if(!condTrue()) finish();
}
function addTok(t,hot){
  var d=document.createElement("span"); d.className="tok"+(hot?" hot":"")+(t==="我爱学习"?" line":"");
  d.textContent=t; outEl.appendChild(d); outEl.scrollTop=outEl.scrollHeight;
}
function finish(){
  st.done=true; stop();
  ivalEl.textContent="—";
  statusEl.textContent = st.mode==="sumOdd" ? ("循环结束，结果 sum = "+st.sum) : "循环结束 ✅";
  btnStep.disabled=true; btnJump.disabled=true;
}
function jump(){
  while(condTrue()){ doStep(); }
  finish();
}
function tick(){ if(st.done||!condTrue()){ finish(); return; } doStep(); }
function play(){
  if(running){ stop(); return; }
  if(st.done) reset();
  running=true; btnPlay.textContent="⏸ 暂停";
  var delay=Math.round(700/parseInt(speed.value,10));
  tick(); timer=setInterval(tick, delay);
}

btnStep.onclick=function(){ stop(); doStep(); };
btnPlay.onclick=play;
btnJump.onclick=function(){ stop(); jump(); };
btnReset.onclick=function(){ reset(); };
speed.oninput=function(){ if(running){ stop(); play(); } };

setup();
})();
</script>
</body>
</html>
